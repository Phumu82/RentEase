name: Android CI

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Write local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "SUPABASE_URL=${{ vars.SUPABASE_URL }}" >> local.properties
          echo "SUPABASE_ANON_KEY=${{ vars.SUPABASE_ANON_KEY }}" >> local.properties

      - name: Use placeholder google-services.json
        run: |
          if [ ! -f app/google-services.json ]; then cp app/google-services.json.example app/google-services.json; fi

      - name: Unit tests
        run: gradle testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-and-apk
          path: |
            app/build/reports/tests/
            app/build/outputs/apk/debug/*.apk
